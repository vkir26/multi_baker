<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Добавить модель мультипекаря</title>
</head>
<body>
    <form action="/model/add" method="post">
        <label>Название модели:</label>
        <input type="text" name="model_name" required>
        <br>
        <label>Панели через запятую:</label>
        <input type="text" name="panel_name" required>
        <br>
        <button type="submit">Добавить</button>
    </form>
</body>
</html>
